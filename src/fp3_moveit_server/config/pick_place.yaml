/**:
  ros__parameters:
    planning_group: "fp3_arm"
    eef_name: "fp3_hand"
    hand_group: "fp3_hand"
    tcp_frame: "fp3_hand_tcp"
    hand_touch_links: ["fp3_hand", "fp3_leftfinger", "fp3_rightfinger"]
    gripper_action_name: "/franka_gripper/grasp"
    gripper_move_action_name: "/franka_gripper/move"

    filter.min_height_above_table: 0.02
    filter.max_approach_tilt_deg: 45.0
    filter.max_reach: 0.85

    approach.min_distance: 0.02
    approach.max_distance: 0.10
    retreat.min_distance: 0.05
    retreat.max_distance: 0.15

    grasp.width: 0.0
    grasp.epsilon_inner: 0.005
    grasp.epsilon_outer: 0.005
    grasp.speed: 0.05
    grasp.force: 20.0
    # Independent of epsilon_inner/outer above (the driver's own
    # force-detection tolerance): this is the tolerance for verifyGrasp()'s
    # post-grasp width check. Keep this tight -- reusing a wide grasp
    # epsilon here defeats the check (observed live: width=0.06,
    # epsilon_inner=0.06 let a grasp that closed on empty air, width~0,
    # pass as "close enough").
    grasp.width_check_tolerance: 0.01

    open.width: 0.08
    open.speed: 0.1

    # TO ADJUST: placeholder "place" location -- no guarantee it's
    # reachable/collision-free in your actual scene.
    place.pose_xyz: [0.4, 0.0, 0.4]

    velocity_scaling_factor: 0.1
    acceleration_scaling_factor: 0.1

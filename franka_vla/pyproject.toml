[project]
name = "franka-vla-backend"
version = "0.1.0"
description = "Franka VLA backend server — bridges agent server to VLA robot worker via ZMQ"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pyzmq>=26.0.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]
